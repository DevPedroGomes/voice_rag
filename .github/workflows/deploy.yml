name: Build & push image (VPS auto-pulls)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Roda ANTES do build e trava o deploy. Cobre o teto diario de gasto: consumo
  # antes da chamada paga, virada em UTC, recusa quando o estado esta ilegivel.
  # Nao toca a rede: sem chave, sem custo.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        working-directory: backend
        run: |
          pip install -q -r requirements.txt
          pip install -q pytest pytest-asyncio
      - name: pytest
        working-directory: backend
        run: python -m pytest tests/ -q

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Placeholder .env (compose precisa p/ parsear env_file; .env real vive na VPS)
        run: cp .env.example .env 2>/dev/null || touch .env
      - name: Build + push (so os servicos buildados, nao upstream)
        run: |
          docker compose build
          docker compose push backend frontend
